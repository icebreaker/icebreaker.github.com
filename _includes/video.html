{% if page.draft %}
<blockquote>
{{ include.src }}
</blockquote>
{% elsif include.src %}
<video muted controls width="1024">
	<source src="{{ include.src }}" type="video/mp4">
	<blockquote>
	Your browser does not support the video element.
	Please click <a href="{{ include.src }}">here</a> in order to download and view the video.
	</blockquote>
</video>
{% endif %}
